<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>论文实验信息 · SenoMiner-AI</title>
<link rel="stylesheet" href="/static/catalog.css">
<script>window.LOCAL_TOKEN = __LOCAL_TOKEN__;</script>
<script defer src="/static/3Dmol-min.js"></script>
<script defer src="/static/catalog.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container header-row">
    <div><strong>SenoMiner-AI</strong><span>论文实验信息提取</span></div>
    <nav aria-label="页面导航"><a href="#inputPanel">上传论文</a><a href="#catalogHeading">化合物列表</a></nav>
  </div>
</header>
<main class="container">
  <section class="intro">
    <h1>论文中的抗衰老化合物</h1>
    <p>上传论文，查找作者报告有效的化合物，查看原文依据、实验步骤与结果。</p>
    <div id="statusLine" class="muted" aria-live="polite">正在读取本地报告…</div>
  </section>
  <section class="search-panel" aria-labelledby="searchHeading">
    <h2 id="searchHeading">查找原始研究</h2>
    <div class="form-line"><input id="pubmedQuery" type="search" aria-label="关键词、DOI 或 PMID" placeholder="关键词、DOI 或 PMID"><button id="searchPubmed" class="primary">查找文献</button><button id="importIdentifier">按编号直接提取</button></div>
    <p class="muted small">DOI / PMID 可直接提取公开全文；无法获取全文时，请上传 PDF。提取会使用已配置的云端模型。</p>
    <div id="searchResults" hidden><h3>检索结果</h3><div id="searchResultRows"></div></div>
  </section>
  <p id="message" class="message" role="status" aria-live="polite"></p>
  <div class="main-grid">
    <section class="catalog-section" aria-labelledby="catalogHeading">
      <div class="section-title"><div><h2 id="catalogHeading">化合物列表</h2><p id="catalogCount" class="muted"></p></div><input id="catalogSearch" type="search" aria-label="搜索已收录化合物" placeholder="筛选化合物或论文"></div>
      <div class="table-wrap"><table class="catalog-table"><thead><tr><th>化合物 / 联合用药</th><th>3D 分子结构</th><th>来源文献</th><th></th></tr></thead><tbody id="catalogRows"></tbody></table></div>
      <nav class="pagination" aria-label="目录分页"><span id="pageInfo"></span><label>每页 <select id="pageSize" aria-label="每页条数"><option value="5">5</option><option value="10">10</option><option value="20">20</option></select> 条</label><button id="prevPage">上一页</button><label>跳到第 <select id="pageSelect" aria-label="选择页码"></select> 页</label><button id="nextPage">下一页</button></nav>
      <p class="muted small">拖动分子可旋转。点击“查看详情”阅读论文中的实验与发现。</p>
    </section>
    <aside id="inputPanel" class="side-panel" aria-labelledby="inputHeading">
      <h2 id="inputHeading">提取进展</h2>
      <div id="taskProgress" class="task-progress" role="status" aria-live="polite"><p class="muted small">尚未开始提取。</p></div>
      <div class="upload-area">
        <label for="pdfUpload">添加 PDF</label>
        <input id="pdfUpload" type="file" accept="application/pdf,.pdf" aria-label="选择 PDF">
        <button id="uploadBtn">上传并提取</button>
        <p class="muted small">论文文字会发送到已配置的云端模型。</p>
      </div>
      <div id="localPdfRows" class="local-list"></div>
      <details class="completed-files"><summary id="completedPdfLabel">已完成文件</summary><div id="completedPdfRows"></div></details>
    </aside>
  </div>
</main>
<dialog id="detailDialog" aria-labelledby="detailTitle">
  <header class="dialog-header"><div><small>论文实验解读</small><h2 id="detailTitle"></h2></div><button id="closeDetail" aria-label="关闭详情">关闭</button></header>
  <div id="detailBody" class="dialog-body"></div>
</dialog>
</body>
</html>
